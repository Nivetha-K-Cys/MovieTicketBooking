<div class="auth-card">
    <h2>🔐 User Login</h2>
    <form onsubmit="AuthComponent.handleLogin(event)">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="login-email" required placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">Login</button>
    </form>
    <p style="text-align:center; margin-top:15px;">Don't have an account? <a href="#" onclick="Router.navigateTo('register')">Register here</a></p>
</div>
