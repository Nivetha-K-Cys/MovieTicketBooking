<div class="auth-card">
    <h2>📝 New User Registration</h2>
    <form onsubmit="AuthComponent.handleRegister(event)">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="reg-name" required placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="reg-email" required placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-password" required placeholder="Create password">
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">Register</button>
    </form>
    <p style="text-align:center; margin-top:15px;">Already have an account? <a href="#" onclick="Router.navigateTo('login')">Login here</a></p>
</div>
